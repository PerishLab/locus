[comment]
allow = false

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
    "crates/*/tests/**/*.rs",
    "crates/locus/src/collector.rs",
    "crates/locus/src/reporter/launcher.rs",
    "crates/locus/src/reporter/spool/tests.rs",
]
syntax = "environment"

[[grant]]
paths = ["packages/*/tests/**/*.test.ts"]
syntax = "test"

[[grant]]
paths = ["packages/*/tests/**/*.test.ts"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = ["**/target/**", "**/.svelte-kit/**", "**/dist/**", "**/node_modules/**"]
include = [
    "crates/**/*.rs",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.svelte",
    "packages/**/*.ts",
]

[word]
single = true

[[ban]]
syntax = "lock"
paths = ["crates/**/*.rs"]
