[comment]
allow = false

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = [
    "crates/*/tests/**/*.rs",
    "crates/locus/src/collector.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "docs",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
    "docs/**/*.md",
]

[word]
single = true
