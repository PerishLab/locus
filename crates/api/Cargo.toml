[package]
name = "locus-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Faithful Atom recording and retrieval service for Locus"

[[bin]]
name = "locus-api"
path = "src/entry/main.rs"

[dependencies]
radicula-oidc.workspace = true
radicula-config = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
keel = { workspace = true }
keel-column = { workspace = true }
locus = { version = "0", registry = "perish" }
locus-derivation = { workspace = true, features = ["utoipa"] }
plumb = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
ureq = { workspace = true, features = ["json"] }
utoipa = { workspace = true }

