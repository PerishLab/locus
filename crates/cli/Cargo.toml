[package]
name = "locus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["perish"]
description = "Query, inspect and adapt external observations through Locus"

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
getrandom = { workspace = true }
locus = { version = "0", registry = "perish" }
locus-derivation = { workspace = true }
plumb = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
shlex = "2"
signal-hook = { workspace = true }
ureq = { workspace = true, features = ["platform-verifier"] }
url = { workspace = true }

[dev-dependencies]
plumb = { workspace = true, features = ["testing"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
locus-api = { workspace = true }
tokio = { workspace = true }
