{{- $image := .Values.image | default dict }}
{{- $storage := .Values.storage | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: "{{ $image.repository | default "ghcr.io/perishlab/locus" }}:{{ $image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: machine
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: machine
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/locus-api.toml
              subPath: locus-api.toml
              readOnly: true
            {{- if .Values.alerts }}
            - name: config
              mountPath: /data/alerts.json
              subPath: alerts.json
              readOnly: true
            {{- end }}
            - name: config
              mountPath: /etc/locus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ $storage.existingClaim | default (printf "%s-data" .Release.Name) }}
