[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The locus library, its source adapters, and the query CLI."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[release]
product = "locus"
authority = "https://releases.locus.perish.uk"
skill = false

[release.cargo]
registry = "perish"
packages = ["locus-macro", "locus", "locus-cli"]
