[layout]

[[layout.seat]]
path = "packages/*"
anchor = ["package.json"]
note = "Static browser UI packaged from its production build."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc"]
note = "JavaScript workspace and its registry and lock configuration."

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The locus library, its source adapters, the query CLI, and the locus-api server."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = "packaging/deb"
anchor = ["control"]
note = "The locus-api Debian placement wharf packs: control, maintainer scripts, and root/ payload."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["Containerfile"]
note = "Wharf constructs the Locus API image from the formal Linux binary."

[[layout.seat]]
path = "charts/*"
anchor = ["Chart.yaml"]
note = "Helm deployment for the machine service."

[identity]
ns = "locus"

[guard.lock]
enforce = true
target = "x86_64-unknown-linux-gnu"
features = ["default", "all-features"]

[release]
authority = "https://releases.locus.perish.uk"
binaries = ["locus-api"]
targets = ["x86_64-unknown-linux-gnu"]
skill = false

[release.binary.locus-api]
install = false

[release.deb]
binary = "locus-api"
root = "packaging/deb"

[release.oci]
registry = "ghcr.io"
image = "perishlab/locus"
account = "PerishLab"
binary = "locus-api"

[release.chart]
registry = "ghcr.io"
chart = "perishlab/locus"
account = "PerishLab"

[release.cargo]
registry = "perish"
packages = ["locus-macro", "locus", "locus-relay", "locus-derivation", "locus-cli"]


[release.npm]
registry = "https://npm.pkg.github.com/"
packages = ["@perishlab/locus", "@perishlab/locus-web"]
