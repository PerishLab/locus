[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The locus library, its source adapters, the query CLI, and the locus-api server."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = "packaging/deb"
anchor = ["control"]
note = "The locus-api Debian placement wharf packs: control, maintainer scripts, and root/ payload."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[release]
product = "locus"
authority = "https://releases.locus.perish.uk"
binaries = ["locus-api"]
targets = ["x86_64-unknown-linux-gnu"]
skill = false

[release.binary.locus-api]
install = false

[release.deb]
binary = "locus-api"
root = "packaging/deb"

[release.cargo]
registry = "perish"
packages = ["locus-macro", "locus", "locus-cli"]
